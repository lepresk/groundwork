version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      nestjs:
        patterns: ['@nestjs/*', 'nestjs-*']
      next-react:
        patterns: ['next', '@next/*', 'react', 'react-dom', '@types/react*']
      lint-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'knip', 'sherif']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom', 'supertest']
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories: ['/docker']
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
