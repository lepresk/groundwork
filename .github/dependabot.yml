# Dependency updates, tuned for this monorepo:
# - Major versions are ignored: they are deliberate migrations (peer ranges
#   such as nestjs-zod -> @nestjs/* 11 or typescript-eslint -> TypeScript 6
#   must move together) and are done by hand with an ADR when needed.
# - Everything else lands as one grouped PR per ecosystem per week.
# - The cooldown mirrors pnpm's `minimumReleaseAge` supply-chain guard.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/docker']
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker-images:
        patterns: ['*']
