# Local infrastructure. `pnpm infra:up` starts it and waits for healthchecks.
# The optional `apps` profile runs the production images locally:
#   docker compose --profile apps up --build
name: groundwork

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U groundwork -d groundwork']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: [apps]
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://groundwork:groundwork@postgres:5432/groundwork
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: [apps]
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://groundwork:groundwork@postgres:5432/groundwork
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    depends_on:
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  web:
    profiles: [apps]
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
