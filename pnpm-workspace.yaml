packages:
  - 'apps/*'
  - 'packages/*'

engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true

# Supply-chain guard: never install a version published less than 24 hours ago.
minimumReleaseAge: 1440

# Install scripts are opt-in. `true` allows native builds, `false` denies explicitly.
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  # Install-time telemetry pulled in by swagger-ui-dist.
  '@scarf/scarf': false

# Single source of truth for versions shared by several workspaces.
# Workspaces reference them as "catalog:", so a family such as @nestjs/*
# always resolves to one version and moves together.
catalog:
  '@nestjs/bullmq': ^11.0.5
  '@nestjs/common': ^11.2.7
  '@nestjs/core': ^11.2.7
  '@nestjs/platform-express': ^11.2.7
  '@nestjs/swagger': ^11.4.7
  '@nestjs/terminus': ^11.1.1
  '@nestjs/testing': ^11.2.7
  '@nestjs/throttler': ^6.7.1
  '@next/eslint-plugin-next': ^16.3.8
  '@swc-node/register': ^1.12.1
  '@swc/cli': ^0.8.1
  '@swc/core': ^1.16.13
  '@testing-library/jest-dom': ^6.10.0
  '@testing-library/react': ^16.3.3
  '@types/node': ^24.19.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/coverage-v8': ^5.0.3
  'bullmq': ^5.81.5
  'drizzle-orm': ^0.45.3
  'eslint': ^10.12.0
  'jsdom': ^27.4.0
  'nestjs-pino': ^5.3.1
  'nestjs-zod': ^5.5.0
  'next': ^16.3.8
  'pino': ^10.4.0
  'pino-http': ^11.0.0
  'pino-pretty': ^13.2.0
  'react': ^19.3.0
  'react-dom': ^19.3.0
  'reflect-metadata': ^0.2.2
  'rxjs': ^7.8.2
  'typescript': ~6.0.3
  'unplugin-swc': ^2.0.0
  'vitest': ^5.0.3
  'zod': ^4.6.5
